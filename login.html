
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عالم ستيتش</title>
    <!-- اربط هنا ملف الـ CSS الخاص بك -->
    <link rel="stylesheet" href="stitch.css">
</head>
<body>

    <!-- الهيدر الثابت -->
    <header class="fixed-header">
<nav class="fixed-nav">
            <ul>
                <li><a href="index.html">Ohana stitch</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html"> Shopping Cart</a></li>
                <li><a href="login.html">log in</a></li>
            </ul>
        </nav>
</header>

    <!-- محتوى صفحة تسجيل الدخول -->
    <main class="main-content">
        <div class="login-wrapper">
            <h1>تسجيل الدخول 💙</h1>
            <p>أهلاً بعودتك إلى عالم ستيتش اللطيف!</p>

            <form action="#" method="POST">
                <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" id="email" name="email" placeholder="أدخل بريدك الإلكتروني..." required>

                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> تذكرني
                    </label>
                    <a href="#" class="forgot-pass">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit">دخول</button>
            </form>

            <div class="login-footer-card">
                <p>ليس لديك حساب بعد؟ <a href="register.html">إنشاء حساب جديد</a></p>
            </div>
        </div>
    </main>

    <!-- الفوتر المتناسق مع موقعك -->
    <footer>
        <div class="footer-logo">
            <h3>Stitch World</h3>
        </div>
        <div class="footer-bottom" style="text-align: center;">
            <p>جميع الحقوق محفوظة © 2026</p>
        </div>
    </footer>

</body>
</html>
